<title>ระบบเกียรติบัตรผู้เข้าร่วมกิจกรรม — กปท. เทศบาลเมืองนอกเมือง</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1F3D3B; --paper:#FFFDF7; --paper-edge:#E4DFD0; --gold:#B8862E;
    --green:#1F6E5A; --err:#B23A2E; --white:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);}
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Mitr:wght@500;600&display=swap');
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--white);}
  .header{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;}
  .header .back{cursor:pointer;font-size:20px;padding:4px 8px;}
  .header .title{font-weight:600;font-size:16px;}
  .page{padding:22px 20px;}
  .eyebrow{color:var(--gold);font-weight:600;font-size:13px;letter-spacing:.5px;}
  h2{font-family:'Mitr',sans-serif;margin:6px 0 4px;font-size:22px;}
  .lead{color:#556;font-size:14.5px;line-height:1.6;margin:0 0 16px;}
  label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px;color:#334;}
  input, select{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--paper-edge);
    font-family:'Sarabun',sans-serif;font-size:15px;background:var(--paper);color:var(--ink);}
  .btn{display:inline-block;text-align:center;padding:13px 18px;border-radius:11px;border:none;
    font-family:'Sarabun',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  .btn-block{display:block;width:100%;margin-top:16px;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--paper-edge);}
  .role-card{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:12px;
    border-radius:14px;border:1.5px solid var(--paper-edge);background:#fff;cursor:pointer;text-align:left;}
  .role-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--ink);flex-shrink:0;}
  .role-title{font-weight:600;font-size:15.5px;}
  .role-desc{font-size:12.5px;color:#667;margin-top:2px;}
  .hint{font-size:13px;color:#667;margin-top:8px;}
  .error-box{background:#FBEAE8;color:var(--err);border-radius:9px;padding:11px 13px;font-size:13.5px;margin-top:10px;}
  .ok-box{background:#E9F5EF;color:var(--green);border-radius:9px;padding:13px;font-size:13.5px;margin-top:10px;font-weight:600;}
  .progress-line{font-size:13.5px;color:#556;margin:10px 0;}
  .stamp-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
  .stamp-dot{width:44px;text-align:center;font-size:10px;color:#556;}
  .stamp-circ{width:36px;height:36px;border-radius:50%;border:2px solid var(--paper-edge);
    display:flex;align-items:center;justify-content:center;font-size:15px;margin:0 auto 4px;}
  .stamp-circ.done{background:var(--green);border-color:var(--green);color:#fff;}
  .reader-box{margin-top:14px;border-radius:12px;overflow:hidden;border:1.5px solid var(--paper-edge);}
  .toolbar{display:flex;gap:10px;margin-top:16px;}
  .toolbar .btn{flex:1;}
  .banner{background:#FFF7E6;border:1px solid #F0D9A0;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#7a5a12;margin-bottom:14px;}

const app = document.getElementById('app');
const state = { view: 'cover', html5qr: null };

function header(showBack){
  return `<div class="header">
    ${showBack ? `<div class="back" onclick="goCover()">←</div>` : ''}
    <div class="title">เกียรติบัตรผู้เข้าร่วมกิจกรรม</div>
  </div>`;
}
function goCover(){ stopScanner(); state.view='cover'; render(); }

async function apiGet(params){
  const url = CERT_API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(data){
  const res = await fetch(CERT_API_URL, { method:'POST', body: JSON.stringify(data) });
  return res.json();
}

function render(){
  if(state.view==='cover') return renderCover();
  if(state.view==='scan') return renderScan();
  if(state.view==='cert-category') return renderCertCategory();
  if(state.view==='cert-student-info') return renderCertStudentInfo();
  if(state.view==='cert') return renderCert();
  if(state.view==='cert-form') return renderCertForm();
  if(state.view==='cert-other-form') return renderCertOtherForm();
}

function renderCover(){
  app.innerHTML = `
    ${header(false)}
    <div class="page">
      <div class="banner">ระบบนี้แยกต่างหากจากระบบลงทะเบียนหลักโดยสมบูรณ์ — ใช้ QR ใบเดิมของผู้ร่วมงานสแกนได้เลย</div>
      <div class="eyebrow">มหกรรมตลาดนัดสุขภาพ กปท. เทศบาลเมืองนอกเมือง</div>
      <h2>เลือกเมนู</h2>
      <button class="role-card" onclick="state.view='scan';render()">
        <div class="role-ic">📷</div>
        <div><div class="role-title">เจ้าหน้าที่ประจำโซน</div><div class="role-desc">สแกน QR สะสมสำหรับเกียรติบัตร (คนละจุดกับการสแกนโหวตของระบบหลัก)</div></div>
      </button>
      <button class="role-card" onclick="state.view='cert-category';render()">
        <div class="role-ic">🏅</div>
        <div><div class="role-title">รับเกียรติบัตร</div><div class="role-desc">เลือกประเภทของท่านก่อนดำเนินการ</div></div>
      </button>
    </div>
  `;
}

/* ---------- certificate: pick category ---------- */
const OTHER_CATEGORIES = [
  { id:'staff', label:'เจ้าหน้าที่ตามคำสั่ง', icon:'🧑‍💼', needsOrg:false },
  { id:'partner', label:'หน่วยงานร่วมจัดนิทรรศการ', icon:'🏛️', needsOrg:true },
  { id:'vendor', label:'ร้านค้า', icon:'🛍️', needsOrg:true },
  { id:'representative', label:'ตัวแทนหน่วยงาน', icon:'🤝', needsOrg:true },
];
function renderCertCategory(){
  const otherButtons = OTHER_CATEGORIES.map(c=>`
    <button class="role-card" onclick="chooseOtherCategory('${c.id}')">
      <div class="role-ic">${c.icon}</div>
      <div><div class="role-title">${c.label}</div><div class="role-desc">ลงทะเบียนชื่อแล้วรับเกียรติบัตรได้ทันที</div></div>
    </button>
  `).join('');
  app.innerHTML = `
    ${header(true)}
    <div class="page">
      <div class="eyebrow">รับเกียรติบัตร</div>
      <h2>ท่านเป็นผู้เข้าร่วมงานประเภทใด</h2>
      <button class="role-card" onclick="state.view='cert-student-info';render()">
        <div class="role-ic">🎓</div>
        <div><div class="role-title">นักเรียน นักศึกษา</div><div class="role-desc">มีระบบแยกต่างหากในเมนูของระบบหลัก</div></div>
      </button>
      <button class="role-card" onclick="state.view='cert';render()">
        <div class="role-ic">🚶</div>
        <div><div class="role-title">ประชาชนทั่วไป</div><div class="role-desc">ต้องสแกนสะสมครบ ${THRESHOLD} จาก ${ZONES.length} โซนก่อน</div></div>
      </button>
      ${otherButtons}
    </div>
  `;
}
function renderCertStudentInfo(){
  app.innerHTML = `
    ${header(true)}
    <div class="page" style="text-align:center;">
      <div class="eyebrow">นักเรียน นักศึกษา</div>
      <h2>ใช้เมนูในระบบหลักแทนครับ</h2>
      <p class="lead">เกียรติบัตรสำหรับนักเรียน/นักศึกษาที่มาศึกษาดูงาน มีระบบแยกต่างหากอยู่แล้วในเว็บระบบหลัก (Digital Health Passport) — กรุณากลับไปเปิดเมนู "ลงทะเบียนศึกษาดูงาน" ที่นั่นแทนครับ</p>
      <button class="btn btn-primary btn-block" onclick="state.view='cert-category';render()">ย้อนกลับ</button>
    </div>
  `;
}
function chooseOtherCategory(categoryId){
  state.otherCategory = OTHER_CATEGORIES.find(c=>c.id===categoryId);
  state.view = 'cert-other-form';
  render();
}

/* ---------- certificate: self-register for staff/partner/vendor/representative ---------- */
function renderCertOtherForm(){
  const cat = state.otherCategory;
  app.innerHTML = `
    ${header(true)}
    <div class="page">
      <div class="eyebrow">${cat.label}</div>
      <h2>กรอกข้อมูลเพื่อรับเกียรติบัตร</h2>
      <label>ชื่อ-นามสกุล</label>
      <input type="text" id="other-name" placeholder="เช่น นายสมชาย ใจดี">
      ${cat.needsOrg ? `
        <label>ชื่อหน่วยงาน / ร้านค้า</label>
        <input type="text" id="other-org" placeholder="เช่น รพ.สต. บ้าน... / ร้าน...">
      ` : ''}
      <div id="other-form-err"></div>
      <button class="btn btn-gold btn-block" onclick="submitOtherCert()">🏅 รับเกียรติบัตร</button>
    </div>
  `;
}
async function submitOtherCert(){
  const cat = state.otherCategory;
  const name = document.getElementById('other-name').value.trim();
  const orgName = cat.needsOrg ? document.getElementById('other-org').value.trim() : '';
  const errBox = document.getElementById('other-form-err');
  if(!name){ errBox.innerHTML = `<div class="error-box">กรุณากรอกชื่อ-นามสกุล</div>`; return; }
  if(cat.needsOrg && !orgName){ errBox.innerHTML = `<div class="error-box">กรุณากรอกชื่อหน่วยงาน/ร้านค้า</div>`; return; }
  errBox.innerHTML = `<div class="hint">กำลังออกเกียรติบัตร...</div>`;
  try{
    const r = await apiPost({ action:'registerAndIssueOtherCert', category:cat.id, name, orgName });
    if(r.error){ errBox.innerHTML = `<div class="error-box">${r.error}</div>`; return; }
    await generateCertificate({ name:r.name, certNo:r.certNo, category:r.category, orgName:r.orgName });
    errBox.innerHTML = '';
  }catch(e){
    errBox.innerHTML = `<div class="error-box">ไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'}</div>`;
  }
}

/* ---------- staff: scan booth ---------- */
function renderScan(){
  const zoneOptions = ZONES.map(z=>`<option value="${z.id}">${z.name}</option>`).join('');
  app.innerHTML = `
    ${header(true)}
    <div class="page">
      <div class="eyebrow">เจ้าหน้าที่ประจำโซน</div>
      <h2>สแกนสะสมสำหรับเกียรติบัตร</h2>
      <p class="lead">เลือกโซนที่ประจำอยู่ แล้วสแกน QR ของผู้ร่วมงาน (ใบเดิม) ทีละคน</p>
      <label>โซนที่ประจำอยู่</label>
      <select id="scan-zone">${zoneOptions}</select>
      <button class="btn btn-primary btn-block" onclick="startScanner()">📷 เริ่มสแกน</button>
      <div id="reader-box"></div>
      <div id="scan-result"></div>
    </div>
  `;
}
function startScanner(){
  const box = document.getElementById('reader-box');
  box.innerHTML = '<div class="reader-box"><div id="reader-inner"></div></div>';
  try{
    state.html5qr = new Html5Qrcode("reader-inner");
    state.html5qr.start(
      { facingMode:"environment" },
      { fps:10, qrbox:230 },
      (decodedText)=>{ handleScan(decodedText.trim()); },
      ()=>{}
    ).catch(()=>{ box.innerHTML = '<div class="hint">ไม่สามารถเปิดกล้องได้ ตรวจสอบสิทธิ์การเข้าถึงกล้อง</div>'; });
  }catch(e){
    box.innerHTML = '<div class="hint">ไม่สามารถเปิดกล้องได้</div>';
  }
}
function stopScanner(){
  try{ if(state.html5qr) state.html5qr.stop().then(()=>state.html5qr.clear()); }catch(e){}
  state.html5qr = null;
}
async function handleScan(uid){
  const zoneId = document.getElementById('scan-zone').value;
  const resultBox = document.getElementById('scan-result');
  resultBox.innerHTML = `<div class="hint">กำลังบันทึก...</div>`;
  try{
    const r = await apiPost({ action:'stampZone', uid, zoneId });
    if(r.error){ resultBox.innerHTML = `<div class="error-box">${r.error}</div>`; return; }
    const zoneName = ZONES.find(z=>z.id===zoneId)?.name || zoneId;
    if(r.alreadyStamped){
      resultBox.innerHTML = `<div class="error-box">${uid} เคยสแกนโซนนี้แล้ว (สะสมได้ ${r.count}/${r.total} โซน)</div>`;
    }else{
      resultBox.innerHTML = `<div class="ok-box">✓ บันทึกแล้ว: ${uid} — ${zoneName}<br>สะสมได้ ${r.count}/${r.total} โซน</div>`;
    }
  }catch(e){
    resultBox.innerHTML = `<div class="error-box">บันทึกไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'}</div>`;
  }
}

/* ---------- participant: check status & get certificate ---------- */
function renderCert(){
  app.innerHTML = `
    ${header(true)}
    <div class="page">
      <div class="eyebrow">รับเกียรติบัตร</div>
      <h2>ตรวจสอบความคืบหน้า</h2>
      <p class="lead">กรอกหรือสแกนรหัส QR ของท่าน (ใบเดิมที่ได้รับตอนลงทะเบียน)</p>
      <label>รหัส (เช่น KPT2026-001)</label>
      <input type="text" id="cert-uid" style="text-transform:uppercase;">
      <button class="btn btn-outline btn-block" onclick="startCertScanner()">📷 สแกน QR แทนการพิมพ์</button>
      <div id="cert-reader-box"></div>
      <button class="btn btn-primary btn-block" onclick="checkStatus()">ตรวจสอบ</button>
      <div id="cert-status-result"></div>
    </div>
  `;
}
function startCertScanner(){
  const box = document.getElementById('cert-reader-box');
  box.innerHTML = '<div class="reader-box"><div id="cert-reader-inner"></div></div>';
  try{
    state.html5qr = new Html5Qrcode("cert-reader-inner");
    state.html5qr.start(
      { facingMode:"environment" },
      { fps:10, qrbox:230 },
      (decodedText)=>{
        document.getElementById('cert-uid').value = decodedText.trim();
        stopScanner();
        box.innerHTML = '';
        checkStatus();
      },
      ()=>{}
    ).catch(()=>{ box.innerHTML = '<div class="hint">ไม่สามารถเปิดกล้องได้ กรุณาพิมพ์รหัสแทน</div>'; });
  }catch(e){
    box.innerHTML = '<div class="hint">ไม่สามารถเปิดกล้องได้</div>';
  }
}
async function checkStatus(){
  const uid = document.getElementById('cert-uid').value.trim();
  const box = document.getElementById('cert-status-result');
  if(!uid){ box.innerHTML = `<div class="error-box">กรุณากรอกรหัส</div>`; return; }
  box.innerHTML = `<div class="hint">กำลังตรวจสอบ...</div>`;
  try{
    const r = await apiGet({ action:'getStatus', uid });
    if(r.error){ box.innerHTML = `<div class="error-box">${r.error}</div>`; return; }
    state.certStatus = r;
    renderStatusResult(r);
  }catch(e){
    box.innerHTML = `<div class="error-box">ตรวจสอบไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'}</div>`;
  }
}
function renderStatusResult(r){
  const box = document.getElementById('cert-status-result');
  const dots = ZONES.map(z=>{
    const done = r.stamps[z.id];
    return `<div class="stamp-dot"><div class="stamp-circ ${done?'done':''}">${done?'✓':''}</div>${z.name}</div>`;
  }).join('');
  const eligible = r.count >= THRESHOLD;
  box.innerHTML = `
    <div class="stamp-row">${dots}</div>
    <div class="progress-line">สะสมแล้ว ${r.count} / ${r.total} โซน (เกณฑ์: อย่างน้อย ${THRESHOLD} โซน)</div>
    ${r.certNo ? `<div class="ok-box">🏅 เคยรับเกียรติบัตรแล้ว เลขที่ ${r.certNo}<br>กดปุ่มด้านล่างเพื่อดาวน์โหลดซ้ำ</div>` : ''}
    ${eligible ? `<button class="btn btn-gold btn-block" onclick="state.view='cert-form';render()">🏅 ${r.certNo?'ดาวน์โหลดเกียรติบัตรอีกครั้ง':'ขอเกียรติบัตร'}</button>`
      : `<div class="hint">ยังไม่ครบเกณฑ์ เข้าร่วมกิจกรรมเพิ่มเติมแล้วกลับมาตรวจสอบใหม่ได้</div>`}
  `;
}

function renderCertForm(){
  const r = state.certStatus || {};
  app.innerHTML = `
    ${header(true)}
    <div class="page">
      <div class="eyebrow">${r.uid || ''}</div>
      <h2>${r.certNo ? 'ดาวน์โหลดเกียรติบัตร' : 'กรอกชื่อสำหรับเกียรติบัตร'}</h2>
      <p class="lead">กรอกชื่อ-นามสกุลให้ถูกต้อง เพราะจะพิมพ์ลงในเกียรติบัตรตามที่กรอก</p>
      <label>ชื่อ-นามสกุล</label>
      <input type="text" id="cert-name" placeholder="เช่น นายสมชาย ใจดี">
      <div id="cert-form-err"></div>
      <button class="btn btn-gold btn-block" onclick="submitCertRequest()">🏅 ${r.certNo?'ดาวน์โหลดเกียรติบัตร':'ยืนยันและรับเกียรติบัตร'}</button>
    </div>
  `;
}
async function submitCertRequest(){
  const name = document.getElementById('cert-name').value.trim();
  const errBox = document.getElementById('cert-form-err');
  if(!name){ errBox.innerHTML = `<div class="error-box">กรุณากรอกชื่อ-นามสกุล</div>`; return; }
  errBox.innerHTML = `<div class="hint">กำลังออกเกียรติบัตร...</div>`;
  try{
    const r = await apiPost({ action:'issueCertNumber', uid: state.certStatus.uid, name });
    if(r.error){ errBox.innerHTML = `<div class="error-box">${r.error}</div>`; return; }
    await generateCertificate({ name: r.name, certNo: r.certNo });
    errBox.innerHTML = '';
  }catch(e){
    errBox.innerHTML = `<div class="error-box">ไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'}</div>`;
  }
}

// วาดเกียรติบัตรบน canvas โดยใช้ภาพต้นแบบเป็นพื้นหลัง แล้วห่อเป็น PDF ขนาด A4 แนวนอน
// data: { name, certNo, category?, orgName? } — category ที่ไม่ใช่ "public"/ว่าง จะปิดทับ
// ย่อหน้าเดิมในภาพแล้วเขียนข้อความเฉพาะประเภทนั้นทับ (ตำแหน่งวัดจากภาพต้นแบบจริง)
async function generateCertificate(data){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const W = 2000, H = 1412;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = new Image();
  await new Promise((res)=>{ bg.onload=res; bg.onerror=res; bg.src = CERT_BG_B64; });
  ctx.drawImage(bg, 0, 0, W, H);

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#143C78';

  let nameSize = 46;
  ctx.font = `600 ${nameSize}px Mitr`;
  while (ctx.measureText(data.name).width > W - 500 && nameSize > 24) {
    nameSize -= 2;
    ctx.font = `600 ${nameSize}px Mitr`;
  }
  ctx.textAlign = 'center';
  const nameY = data.orgName ? 570 : 585;
  ctx.fillText(data.name, W/2, nameY);

  if(data.orgName){
    ctx.font = '700 26px Sarabun';
    const orgLabel = { partner:'หน่วยงาน', vendor:'ร้าน', representative:'หน่วยงาน' }[data.category] || 'หน่วยงาน';
    ctx.fillText(`${orgLabel}: ${data.orgName}`, W/2, 638);
  }

  const paragraph = CERT_PARAGRAPHS[data.category];
  if(paragraph){
    ctx.fillStyle = '#FDFDFD';
    ctx.fillRect(380, 655, 1340, 230);
    ctx.fillStyle = '#143C78';
    ctx.font = '400 28px Sarabun';
    let py = 700;
    paragraph.forEach(line=>{
      ctx.fillText(line, W/2, py);
      py += 40;
    });
  }

  ctx.textAlign = 'left';
  ctx.font = '700 30px Sarabun';
  ctx.fillText(data.certNo, 1560, 55);

  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
  pdf.save(`เกียรติบัตร-${data.certNo.replace(/\//g,'-')}.pdf`);
}
